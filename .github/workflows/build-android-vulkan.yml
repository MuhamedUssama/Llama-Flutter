name: Build Android Vulkan

on:
  push:
    paths: ['android/**', '.github/workflows/build-android-vulkan.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android-vulkan.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install native toolchain
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Configure and compile the package native libraries
        shell: bash
        run: |
          set -euo pipefail
          NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          CMAKE_BIN="$ANDROID_HOME/cmake/3.22.1/bin"
          "$CMAKE_BIN/cmake" -S android -B build/android-vulkan -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$CMAKE_BIN/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-fvisibility=hidden
          "$CMAKE_BIN/cmake" --build build/android-vulkan --target llama_jni --parallel 4
      - name: Verify Vulkan registration and Android loader linkage
        shell: bash
        run: |
          set -euo pipefail
          READELF="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          LIB_DIR=build/android-vulkan/bin
          "$READELF" -d build/android-vulkan/libllama_jni.so > build/jni-dependencies.txt
          "$READELF" -d "$LIB_DIR/libllama.so" > build/llama-dependencies.txt
          "$READELF" -d "$LIB_DIR/libggml.so" > build/ggml-dependencies.txt
          "$READELF" -d "$LIB_DIR/libggml-vulkan.so" > build/vulkan-dependencies.txt
          "$READELF" --dyn-syms "$LIB_DIR/libggml.so" > build/ggml-symbols.txt
          "$READELF" --dyn-syms "$LIB_DIR/libggml-vulkan.so" > build/vulkan-symbols.txt
          grep -q 'libllama.so' build/jni-dependencies.txt
          grep -q 'libggml.so' build/llama-dependencies.txt
          grep -q 'libggml-vulkan.so' build/ggml-dependencies.txt
          grep -q 'libvulkan.so' build/vulkan-dependencies.txt
          grep -q 'UND.*ggml_backend_vk_reg' build/ggml-symbols.txt
          grep -q 'GLOBAL.*DEFAULT.*ggml_backend_vk_reg' build/vulkan-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-vulkan
          path: |
            build/android-vulkan/**/*.so
            build/*-dependencies.txt
            build/*-symbols.txt
